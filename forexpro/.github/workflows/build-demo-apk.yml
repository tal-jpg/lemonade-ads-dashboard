name: Build demo APK

# Builds an installable demo APK with sample data — no Firebase project, no
# signing setup, no local Android SDK required.
#
# Run it: Actions → "Build demo APK" → Run workflow.
# Then download "fxpulse-demo-apk" from the run summary and install it.
#
# It also runs on any push that touches the mobile app, so main always has a
# downloadable build.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Data source'
        required: true
        default: 'demo'
        type: choice
        options: [demo, live]
  push:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-demo-apk.yml'

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # AGP 8.x requires JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Configure build
        env:
          MODE: ${{ inputs.mode || 'demo' }}
        run: |
          if [ "$MODE" = "demo" ]; then
            cp .env.demo .env
            cp google-services.demo.json google-services.json
            echo "Building in DEMO mode — sample data, no backend."
          else
            # A live build needs the real config supplied as a repository secret.
            if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
              echo "::error::Live build requires the GOOGLE_SERVICES_JSON secret."
              exit 1
            fi
            printf '%s' '${{ secrets.GOOGLE_SERVICES_JSON }}' > google-services.json
            echo "EXPO_PUBLIC_DEMO_MODE=0" > .env
            echo "Building in LIVE mode."
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Generate the native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        working-directory: mobile/android

      - name: Rename the artifact
        run: |
          mkdir -p ../artifacts
          cp app/build/outputs/apk/release/app-release.apk \
             "../artifacts/fxpulse-${{ inputs.mode || 'demo' }}-${{ github.run_number }}.apk"
          ls -lh ../artifacts
        working-directory: mobile/android

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: fxpulse-demo-apk
          path: mobile/artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### APK ready"
            echo ""
            echo "Mode: **${{ inputs.mode || 'demo' }}**"
            echo ""
            echo "Download **fxpulse-demo-apk** from the Artifacts section of this run,"
            echo "unzip it, and install the .apk on any Android device."
            echo ""
            echo "The demo build needs no account and no network. Use"
            echo "**Profile → Demo build → Premium access** to switch tiers."
          } >> "$GITHUB_STEP_SUMMARY"
