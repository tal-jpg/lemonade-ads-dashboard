name: dm-bot tests

# The bot is the only Python in the repo with tests, so scope the run to it —
# dashboard-only changes shouldn't spin up a job that tests nothing.
on:
  pull_request:
    paths:
      - 'dm_bot/**'
      - '.github/workflows/dm-bot-tests.yml'
  push:
    branches: [claude/serene-bohr-CUY7H]
    paths:
      - 'dm_bot/**'
      - '.github/workflows/dm-bot-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: dm_bot/requirements.txt

      - name: Install dependencies
        run: pip install -r dm_bot/requirements.txt

      - name: Run tests
        working-directory: dm_bot
        run: python test_dm_bot.py

      # rules.example.json is what a new install copies from, so a typo in it
      # breaks setup for everyone. Parse it the same way the app does.
      - name: Validate rules.example.json
        working-directory: dm_bot
        run: python -c "import rules; rs = rules.load_rules('rules.example.json'); print(f'ok — {len(rs.rules)} rules, {len(rs.accounts)} accounts')"
